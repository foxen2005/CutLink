<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://127.0.0.1:7474 'unsafe-inline' 'unsafe-eval'; connect-src http://127.0.0.1:7474 'self';">
  <title>Cameo Cut</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- ===== ESTADO ===== -->
    <section class="card" id="sec-status">
      <div class="row status-row">
        <span class="dot" id="status-dot"></span>
        <span class="status-text" id="status-text">Bridge no iniciado</span>
        <button id="btn-start-bridge" class="btn small" title="Lanza el bridge Python en segundo plano">Iniciar bridge</button>
        <button id="btn-menu" class="btn icon" title="Ajustes" aria-label="Ajustes" aria-expanded="false">&#9776;</button>
      </div>
      <div id="settings" hidden>
        <div class="card-title"><span>Ajustes</span></div>
        <div class="field">
          <label for="cfg-python">Ejecutable Python</label>
          <input type="text" id="cfg-python" placeholder="python">
        </div>
        <div class="field">
          <label for="cfg-root">Carpeta raíz del bridge</label>
          <input type="text" id="cfg-root" placeholder="D:\SandBox\cameo-illustrator">
        </div>
        <div class="field">
          <label for="cfg-url">URL del bridge</label>
          <input type="text" id="cfg-url" placeholder="http://127.0.0.1:7474">
        </div>
        <div class="row">
          <button id="btn-save-settings" class="btn small">Guardar ajustes</button>
          <span class="hint">Node: <span id="node-status">?</span></span>
        </div>
      </div>
    </section>

    <!-- ===== QUÉ CORTAR ===== -->
    <details class="card" id="sec-source" open>
      <summary class="card-title">
        <span>Qué cortar</span>
        <button id="btn-refresh-doc" class="btn small">Actualizar</button>
      </summary>
      <div class="doc-name" id="doc-name">Sin documento</div>
      <div class="radio-group">
        <label class="radio"><input type="radio" name="mode" value="selection" checked> Selección</label>
        <label class="radio radio-inline">
          <input type="radio" name="mode" value="layer"> Capa:
          <select id="sel-layer" class="inline-select"></select>
        </label>
        <label class="radio"><input type="radio" name="mode" value="all"> Todo el documento</label>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" id="chk-color"> Solo trazos de color</label>
        <select id="sel-color" class="inline-select" disabled></select>
        <span class="swatch" id="color-swatch"></span>
      </div>
      <!-- Las imágenes colocadas no son vectores: qué línea de corte generar para ellas -->
      <div class="grid2">
        <div class="field">
          <label for="sel-images">Imágenes colocadas</label>
          <select id="sel-images">
            <option value="ignore">Ignorar</option>
            <option value="rect">Rectángulo (sus límites)</option>
            <option value="trace" selected>Silueta automática (auto-trazado)</option>
          </select>
        </div>
        <div class="field">
          <label for="in-image-margin">Margen (mm)</label>
          <input type="number" id="in-image-margin" min="0" max="10" step="0.5" value="1" title="Sangrado alrededor de la silueta/rectángulo">
        </div>
      </div>
    </details>

    <!-- ===== MATERIAL ===== -->
    <details class="card" id="sec-material" open>
      <summary class="card-title">
        <span>Material</span>
        <span class="summary-hint" id="material-summary"></span>
      </summary>
      <div class="row">
        <select id="sel-material" class="grow"><option value="">(sin materiales — bridge no conectado)</option></select>
        <button id="btn-material-save" class="btn small" title="Guardar los valores actuales en este material propio">Guardar</button>
        <button id="btn-material-saveas" class="btn small" title="Crear un material propio con los valores actuales">Guardar como…</button>
        <button id="btn-material-delete" class="btn small btn-danger" title="Eliminar este material propio">✕</button>
      </div>
      <!-- CEP no implementa window.prompt(): el nombre se pide en línea -->
      <div id="material-saveas-box" class="row" hidden>
        <input type="text" id="in-material-name" class="grow" placeholder="Nombre del nuevo material">
        <button id="btn-material-saveas-ok" class="btn small">Crear</button>
        <button id="btn-material-saveas-cancel" class="btn small">Cancelar</button>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="in-pressure">Presión (1–33)</label>
          <input type="number" id="in-pressure" min="1" max="33" step="1">
        </div>
        <div class="field">
          <label for="in-speed">Velocidad (1–30)</label>
          <input type="number" id="in-speed" min="1" max="30" step="1">
        </div>
        <div class="field">
          <label for="sel-blade">Cuchilla</label>
          <div class="row tight">
            <select id="sel-blade" class="grow"></select>
            <button id="btn-blade-edit" class="btn small" title="Gestionar cuchillas">⚙</button>
          </div>
        </div>
        <div class="field">
          <label for="in-depth" id="lbl-depth">Profundidad (1–10)</label>
          <input type="number" id="in-depth" min="1" max="10" step="1" placeholder="no tocar">
        </div>
        <div class="field">
          <label for="in-passes">Pasadas (1–5)</label>
          <input type="number" id="in-passes" min="1" max="5" step="1" value="1">
        </div>
        <div class="field">
          <label for="sel-tool">Herramienta</label>
          <select id="sel-tool">
            <option value="1">1 (izquierda)</option>
            <option value="2">2 (derecha)</option>
          </select>
        </div>
        <div class="field">
          <label for="sel-mat">Mat</label>
          <select id="sel-mat">
            <option value="0">Sin mat</option>
            <option value="1" selected>12x12</option>
            <option value="2">12x24</option>
          </select>
        </div>
        <div class="field">
          <label for="chk-home">Al terminar</label>
          <label class="check"><input type="checkbox" id="chk-home" checked> Volver al origen</label>
        </div>
      </div>
      <!-- Con mat, la hoja va sobre la cuadrícula del mat, no en el origen de la máquina -->
      <div id="mat-offset" class="grid2" hidden>
        <div class="field">
          <label for="in-matx">Origen hoja en mat X (mm)</label>
          <input type="number" id="in-matx" step="0.5" value="0">
        </div>
        <div class="field">
          <label for="in-maty">Origen hoja en mat Y (mm)</label>
          <input type="number" id="in-maty" step="0.5" value="0">
        </div>
      </div>

      <!-- Gestión de perfiles de cuchilla -->
      <div id="blade-editor" class="sub" hidden>
        <div class="card-title"><span>Perfil de cuchilla</span></div>
        <div class="field">
          <label for="bl-name">Nombre</label>
          <input type="text" id="bl-name" placeholder="Ej. Trinquete 60° (vinilo grueso)">
        </div>
        <div class="grid3">
          <div class="field">
            <label for="bl-type">Tipo</label>
            <select id="bl-type">
              <option value="ratchet">Trinquete</option>
              <option value="auto">AutoBlade</option>
              <option value="pen">Pluma</option>
            </select>
          </div>
          <div class="field">
            <label for="bl-offset">Offset (mm)</label>
            <input type="number" id="bl-offset" min="0" max="2" step="0.05" value="0.25">
          </div>
          <div class="field">
            <label for="bl-tool">Carro</label>
            <select id="bl-tool">
              <option value="1">1</option>
              <option value="2">2</option>
            </select>
          </div>
        </div>
        <div class="row">
          <button id="btn-blade-save" class="btn small">Guardar cuchilla</button>
          <button id="btn-blade-delete" class="btn small btn-danger">Eliminar</button>
          <span class="hint" id="blade-hint"></span>
        </div>
      </div>
    </details>

    <!-- ===== PRINT & CUT ===== -->
    <details class="card" id="sec-pnc">
      <summary class="card-title">
        <span>Print &amp; Cut</span>
        <span class="badge" id="pnc-badge" hidden>activo</span>
      </summary>
      <label class="check"><input type="checkbox" id="chk-pnc"> Activar Print &amp; Cut</label>
      <div class="radio-group">
        <label class="radio"><input type="radio" name="pnc-mode" value="auto" checked> Automático (la máquina busca el cuadrado)</label>
        <label class="radio"><input type="radio" name="pnc-mode" value="manual"> Manual (poner la cuchilla sobre el cuadrado)</label>
      </div>
      <div id="pnc-manual-box" class="hint" hidden>Con las flechas de la pantalla de la Cameo deja la cuchilla justo encima del cuadrado negro y pulsa CORTAR.</div>
      <div class="grid2">
        <div class="field">
          <label for="in-inset">Inset (mm)</label>
          <input type="number" id="in-inset" min="5" max="50" step="0.5" value="10">
        </div>
        <div class="field">
          <label for="in-inset-bottom">Inset inferior (mm)</label>
          <input type="number" id="in-inset-bottom" min="5" max="60" step="0.5" value="25" title="Sin mat la máquina necesita 25 mm abajo; con mat, 10">
        </div>
        <div class="field">
          <label for="in-thick">Grosor de líneas (mm)</label>
          <input type="number" id="in-thick" min="0.1" max="2" step="0.05" value="0.5">
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="in-calx">Calib. X (mm)</label>
          <input type="number" id="in-calx" step="0.1" value="0">
        </div>
        <div class="field">
          <label for="in-caly">Calib. Y (mm)</label>
          <input type="number" id="in-caly" step="0.1" value="0">
        </div>
      </div>
      <div class="row">
        <button id="btn-add-regmarks" class="btn small">Agregar marcas al documento</button>
        <button id="btn-remove-regmarks" class="btn small">Quitar marcas</button>
      </div>
      <div class="hint" id="regmarks-info">El documento no tiene marcas.</div>
    </details>

    <!-- ===== VISTA PREVIA ===== -->
    <details class="card" id="sec-preview" open>
      <summary class="card-title">
        <span>Vista previa</span>
        <button id="btn-preview" class="btn small">Vista previa</button>
      </summary>
      <canvas id="preview-canvas" width="320" height="200"></canvas>
      <div class="stats" id="preview-stats">Sin vista previa.</div>
    </details>

    <!-- ===== CORTAR ===== -->
    <section class="card" id="sec-cut">
      <button id="btn-cut" class="btn btn-cut">CORTAR</button>
      <div id="job-box" hidden>
        <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="row">
          <span class="job-msg" id="job-msg"></span>
          <button id="btn-abort" class="btn small btn-danger">Abortar</button>
        </div>
      </div>
    </section>

    <!-- ===== LOG ===== -->
    <section class="log" id="log"></section>

  </div>

  <script src="lib/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
